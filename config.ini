[server]
# ============================================================
#  想切换测试环境，只改这里的 base_url，其余代码一个字都不用动
#  例如：
#    正式练习站   https://jsonplaceholder.typicode.com
#    换个地址试试  https://httpbin.org
# ============================================================
base_url = https://jsonplaceholder.typicode.com
timeout = 10

[log]
# 日志级别：DEBUG / INFO / WARNING / ERROR
level = INFO
# 日志写到哪个文件（相对本文件所在目录）
file = logs/test.log
