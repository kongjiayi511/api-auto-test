[server]
# ============================================================
#  想切换测试环境，只改这里的 base_url，其余代码一个字都不用动
#  例如：
#    正式练习站   https://jsonplaceholder.typicode.com
#    换个地址试试  https://httpbin.org
# ============================================================
base_url = https://jsonplaceholder.typicode.com
timeout = 10

[alt_env]
# ============================================================
#  异常场景专用站点
#
#  为什么需要第二个环境：
#    jsonplaceholder 只会返回 404，想让接口返回 400 / 405 / 500 它做不到。
#    而 4xx 家族里 400（请求本身有问题）和 405（方法不允许）是面试常考、
#    真实项目里也最常见的两类，必须能覆盖到。
#    httpbin 的特点是可以按需返回指定状态码，正好用来验证
#    "客户端拿到这些状态码之后该怎么判断"。
# ============================================================
base_url = https://httpbin.org

[log]
# 日志级别：DEBUG / INFO / WARNING / ERROR
level = INFO
# 日志写到哪个文件（相对本文件所在目录）
file = logs/test.log
