[pytest]
# 到哪个目录找用例
testpaths = tests

# 什么名字的文件算用例文件（默认就是这个，写出来便于理解）
python_files = test_*.py

# 什么名字的类算用例类、什么名字的函数算用例函数
python_classes = Test*
python_functions = test_*

# ============================================================
#  标记（marker）
#  用法：
#    python -m pytest -m smoke      只跑冒烟用例
#    python -m pytest -m negative   只跑负向用例
#    python -m pytest -m "not smoke" 跳过冒烟
#
#  为什么需要它：用例一多，全量跑要好几分钟。
#  改了一行代码只想快速确认主流程没坏，就跑 -m smoke。
#  未在这里登记的标记会触发警告，所以养成"用之前先登记"的习惯。
# ============================================================
markers =
    smoke: 冒烟用例——核心链路，每次提交都必须通过
    negative: 负向用例——验证系统在异常输入/异常状态下的表现

# pytest 默认会把用例 id 里的非 ASCII 字符转义成 \u67e5 这种形式
# （为了兼容不支持 UTF-8 的老终端）。
# 后果是 HTML 报告里全是转义码，看不出测的是哪条。
# 这个开关关掉转义，中文用例名才能原样显示。
# 注意：关掉之后，cmd 窗口需要 chcp 65001 才能正常显示中文。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 默认参数：
#   -v                          显示每条用例名
#   --tb=short                  失败时只打印有用的那段堆栈
#   --html=reports/report.html  生成 HTML 报告
#   --self-contained-html       把 CSS/JS 内嵌进 html，单个文件即可分享
addopts = -v --tb=short --html=reports/report.html --self-contained-html
